name: RD -> Vendas (SharePoint)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # rede de seguranca; o GitHub atrasa e pula disparos
  workflow_dispatch:
    inputs:
      modo:
        description: "O que executar"
        type: choice
        default: gravar
        options: [gravar, dry-run, campos, diagnostico, listar]

permissions:
  contents: read

concurrency:
  group: rd-vendas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atraso do disparo
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Agendado: ${{ github.event.schedule || 'n/a' }}  |  Agora: $(date -u '+%H:%M:%S') UTC"

      - name: Executar
        run: |
          case "${{ inputs.modo || 'gravar' }}" in
            diagnostico) python sync_rd_vendas.py --diagnostico ;;
            campos)  python sync_rd_vendas.py --campos  ;;
            listar)  python sync_rd_vendas.py --listar  ;;
            dry-run) python sync_rd_vendas.py --dry-run ;;
            *)       python sync_rd_vendas.py           ;;
          esac
        env:
          RD_TOKEN:              ${{ secrets.RD_TOKEN }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID:   ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FILE_ID:    "01EBFAZOLX726YDHARANGY3U4R7G5H23HP"
          CUTOFF_DATE:           "2026-08-09"
          SHEET_NAME:            "Vendas"
          TABLE_NAME:            "Tabela4"
          LOOKBACK_ROWS:         "800"
