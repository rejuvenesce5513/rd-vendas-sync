name: RD -> Vendas (SharePoint)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # rede de seguranca; o gatilho principal e o cron-job.org
  workflow_dispatch:
    inputs:
      modo:
        description: "O que executar"
        type: choice
        default: gravar
        options: [gravar, dry-run, fg-procedimentos, fg-agenda-dry, fg-agenda, cirurgias-diag, cirurgias-dry, cirurgias, feegow, feegow-bf-dry, feegow-bf, pipelines, campos-pv, bruto-pv, pv-dry, prevendas, campos, diagnostico, listar]

permissions:
  contents: read

concurrency:
  group: rd-vendas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atraso do disparo
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Agendado: ${{ github.event.schedule || 'n/a' }}  |  Agora: $(date -u '+%H:%M:%S') UTC"

      - name: Executar
        run: |
          case "${{ inputs.modo || 'gravar' }}" in
            diagnostico) python sync_rd_vendas.py --diagnostico ;;
            campos)  python sync_rd_vendas.py --campos  ;;
            listar)  python sync_rd_vendas.py --listar  ;;
            dry-run) python sync_rd_vendas.py --dry-run ;;
            pipelines)  python sync_rd_vendas.py --pipelines  ;;
            campos-pv)  python sync_rd_vendas.py --campos-pv  ;;
            bruto-pv)   python sync_rd_vendas.py --bruto-pv   ;;
            feegow)     python sync_rd_vendas.py --feegow     ;;
            feegow-bf-dry) python sync_rd_vendas.py --feegow-backfill --dry-run ;;
            feegow-bf)     python sync_rd_vendas.py --feegow-backfill ;;
            fg-procedimentos) python sync_rd_vendas.py --feegow-procedimentos ;;
            fg-agenda-dry) python sync_rd_vendas.py --feegow-agenda --dry-run ;;
            fg-agenda)     python sync_rd_vendas.py --feegow-agenda ;;
            cirurgias-diag) python sync_rd_vendas.py --cirurgias-diag ;;
            cirurgias-dry) python sync_rd_vendas.py --cirurgias --dry-run ;;
            cirurgias)     python sync_rd_vendas.py --cirurgias ;;
            prevendas)  python sync_rd_vendas.py --prevendas  ;;
            pv-dry)     python sync_rd_vendas.py --prevendas --dry-run ;;
            *)       python sync_rd_vendas.py           ;;
          esac
        env:
          RD_TOKEN:              ${{ secrets.RD_TOKEN }}
          FEEGOW_TOKEN:          ${{ secrets.FEEGOW_TOKEN }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID:   ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FILE_ID:    "01EBFAZOLX726YDHARANGY3U4R7G5H23HP"
          CUTOFF_DATE:           "2026-08-01"
          SHEET_NAME:            "Vendas"
          TABLE_NAME:            "Tabela4"
          LOOKBACK_ROWS:         "0"

          # --- posicao das colunas apos a limpeza das formulas ---
          COL_ID:                "L"    # ID RD
          COL_CIRURGIA:          "M"    # Data Prevista de Cirurgia
          COL_CIR_MARCADA:       "N"    # Data Cirurgia foi marcada?
          COL_FEEGOW:            "O"    # ID Feegow — crie o cabecalho em O1 antes
          LER_ATE:               "O"    # ultima coluna lida
          FORMULA_RANGES:        ""     # nao ha mais colunas calculadas

          # --- aba Prevendas ---
          SHEET_PV:              "Prevendas"
          CUTOFF_PV:             "2026-08-01"
          # a API do RD nao devolve o funil na listagem: separamos pela etapa
          ETAPAS_PV:             "NOVO CONTATO,QUALIFICACAO E INTERESSE,AVALIACAO,REALIZADAS,NO SHOW,DIA 1,DIA 2,DIA 3,DIA 4,DIA 5,DIA 6,DIA 7"
          CF_PV_PRIMEIRO:        ""       # nao existe na API: derivado do historico de etapas
          CF_PV_ULTIMO:          ""       # nao existe: usa last_activity_at
          PV_DETALHE_MAX:        "80"     # detalhe (primeiro contato) de ate N negocios por ciclo
          PV_CONTATO_MAX:        "80"     # ID do contato de ate N negocios por ciclo (0 desliga)
          CF_PV_AGENDOU:         "6740c0264636ba001da07a13"
          CF_PV_REALIZADA:       "68a4b62611150a0014b02f4b"
          CF_PV_MEIO:            "6740c07d840a380026d05b3e"
          CF_PV_AVALIADOR:       "691b0d0ab5e2d0001db1085d"
          CF_PV_DATA_AVAL:       "691e0f68034fef0015ca1a3f"
          CF_PV_FEEGOW:          "6a6b5afb84ec2f001de5df5a"
          CF_ID_FEEGOW:          "6a6b5afb84ec2f001de5df5a"   # usado pelos modos "feegow"
          # --- aba Marcacoes, alimentada pelo Feegow ---
          SHEET_MARCACOES:       "Marcações"
          FEEGOW_PROCEDIMENTOS:  "1,3,16"   # 1a avaliacao presencial, online, reavaliacao
          FEEGOW_DIAS_TRAS:      "30"
          FEEGOW_DIAS_FRENTE:    "90"
          FEEGOW_STATUS_ATENDIDO: "Atendido"
          FEEGOW_MAX_NOMES:      "60"       # buscas de nome de paciente por ciclo

          # --- planilha de Cirurgias (arquivo separado) ---
          ARQ_CIRURGIAS:         "https://rejuvenesce.sharepoint.com/sites/ClnicaRejuvenesce-Comercial/Documentos%20Compartilhados/Cirurgias.xlsx"
          SHEET_CIRURGIAS:       "Cirurgias"
          CIRURGIA_PROCEDIMENTOS: "8"       # 8 = Cirurgia (confirmado no diagnostico)
          FEEGOW_JANELA_DIAS:    "150"      # a API recusa intervalos de 6 meses ou mais
          CIRURGIA_NOME_CONTEM:  "CIRURGIA"
          CIRURGIA_STATUS:       "Aguardando,Chamando,Marcado - não confirmado,Aguardando pagamento,Atendido,Em atendimento,Marcado - confirmado"
          CIRURGIA_DE:           "01-09-2026"   # o passado nao muda mais
          CIRURGIA_ATE:          "31-12-2026"

          FEEGOW_DE:             "2026-06-01"   # backfill: inicio (inclusivo)
          FEEGOW_ATE:            "2026-08-01"   # backfill: fim (exclusivo)
